<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSense AI Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <div class="brand">CodeSense AI</div>
          <div class="subtitle">Detect mistakes while you code.</div>
        </div>
        <label class="toggle">
          <input id="enabled" type="checkbox" checked />
          <span>Enabled</span>
        </label>
      </header>

      <main class="settings-panel">
        <label class="field">
          <span>Voice</span>
          <input id="voiceEnabled" type="checkbox" checked />
        </label>

        <label class="field">
          <span>Voice personality</span>
          <select id="voicePersonality">
            <option value="professional">Professional</option>
            <option value="friendly">Friendly</option>
            <option value="roast">Desi Roast</option>
          </select>
        </label>

        <label class="field">
          <span>Profanity</span>
          <input id="profanityEnabled" type="checkbox" />
        </label>

        <label class="field">
          <span>Voice language</span>
          <select id="voiceLanguage">
            <option value="en-IN">English (IN)</option>
            <option value="hi-IN">Hindi</option>
          </select>
        </label>

        <label class="field">
          <span>Speech rate</span>
          <input id="speechRate" type="range" min="0.7" max="1.5" step="0.1" value="1" />
        </label>

        <label class="field">
          <span>Volume</span>
          <input id="speechVolume" type="range" min="0" max="1" step="0.1" value="0.8" />
        </label>

        <label class="field">
          <span>Analysis mode</span>
          <select id="analysisMode">
            <option value="balanced">Balanced</option>
            <option value="strict">Strict</option>
            <option value="quiet">Quiet</option>
          </select>
        </label>

        <label class="field">
          <span>Backend URL</span>
          <input id="backendUrl" type="text" value="http://localhost:8000" />
        </label>

        <label class="field field-block">
          <span>Custom voice prompt</span>
          <textarea id="voiceMessageOverride" rows="2" placeholder="Optional override text"></textarea>
        </label>

        <button id="saveButton" class="primary-button">Save settings</button>
        <div id="status" class="status" aria-live="polite"></div>
      </main>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
